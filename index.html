<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #edf6f1;
      color: #183b32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #f8fbf8 0%, #edf6f1 68%);
    }

    main {
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 600;
      line-height: 1.05;
    }

    button {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 6px;
      background: #226b55;
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: #194f40;
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 3px solid #8cc9ad;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="greeting">Hello, World!</h1>
    <button id="name-button" type="button">Say my name</button>
  </main>

  <script>
    document.getElementById("name-button").addEventListener("click", () => {
      document.getElementById("greeting").textContent = "Hello, Suhana!";
    });
  </script>
</body>
</html>
